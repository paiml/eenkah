[package]
name = "eenkah-connect"
description = "Garmin Connect client: SSO login, OAuth1/OAuth2 tokens, incremental download into a local inbox."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
log = "0.4"
regex = "1"
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["cookies", "json"] }
url.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
